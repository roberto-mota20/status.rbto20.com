name: Static Site CI

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "index.html"
      - "style.css"
      - "app.js"
      - "privacidade.html"
      - "404.html"
      - ".upptimerc.yml"
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  release:
    name: Build and deploy site
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Prepare static site distribution
        run: |
          mkdir -p dist
          cp -r index.html style.css app.js privacidade.html privacidade 404.html dist/
          mkdir -p dist/assets
          cp -r assets/JetBrainsMono-VariableFont_wght.ttf assets/pfp.jpg dist/assets/ 2>/dev/null || true
          [ -d "assets/tags" ] && cp -r assets/tags dist/assets/ || true
          [ -d "graphs" ] && cp -r graphs dist/ || true
          [ -d "history" ] && cp -r history dist/ || true
          [ -d "api" ] && cp -r api dist/ || true
          echo "status.rbto20.com" > dist/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: "./dist"
          cname: "status.rbto20.com"
          force_orphan: "false"
          user_name: "GitHub Actions"
          user_email: "actions@github.com"
