<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Status</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css?v=2.4.0" />
</head>

<body>
  <div class="site-wrapper status-wrapper">
    <main class="status-frame" role="main">

      <!-- Navigation Header (Same as Publicações tab) -->
      <header class="privacy-header" aria-label="Cabeçalho Principal">
        <h1 class="header-name">Status</h1>
        <div class="publ-nav-actions">
          <a href="https://rbto20.com" class="btn-exit" id="btn-home-back" aria-label="Voltar para a página inicial">
            <span class="btn-exit-icon">←</span>
            <span>Início</span>
          </a>
        </div>
      </header>

      <!-- Global Status Banner -->
      <section class="status-hero" id="global-status-hero" aria-label="Status Geral">
        <div class="status-hero-left">
          <span class="status-pulse-dot" aria-hidden="true"></span>
          <span class="status-hero-text">Todos os sistemas operacionais</span>
        </div>
        <span class="status-hero-time" id="last-updated-text">Atualizado há poucos segundos</span>
      </section>

      <!-- Services List (90-Day Timeline with Real Data) -->
      <section class="services-section" aria-label="Serviços Monitorados">
        <div class="section-header">
          <h2 class="section-title">Serviços</h2>
        </div>
        <div id="services-list">
          <!-- Rendered dynamically by app.js -->
        </div>
      </section>

      <!-- Response Time Metrics Section -->
      <section class="metrics-card" aria-label="Métricas de Tempo de Resposta">
        <div class="metrics-header">
          <h2 class="metrics-title">Tempo de Resposta</h2>
        </div>

        <div class="metrics-grid" id="metrics-summary-grid">
          <!-- Rendered dynamically by app.js -->
        </div>
      </section>

      <!-- Incident History Section (Shown only if incidents exist) -->
      <section class="incidents-card" id="incidents-section" aria-label="Histórico de Incidentes">
        <h2 class="metrics-title">Histórico de Incidentes</h2>
        <div id="incidents-list">
          <!-- Rendered dynamically if incidents exist -->
        </div>
      </section>

    </main>

    <!-- Corner Privacy Link -->
    <div class="corner-privacy">
      <a href="./privacidade" class="privacy-link" id="link-privacy">
        privacidade
      </a>
    </div>

  </div>

  <!-- Interactive Tooltip -->
  <div class="custom-tooltip" id="app-tooltip" role="tooltip"></div>

  <!-- Application Script -->
  <script src="app.js?v=2.1.0"></script>
</body>

</html>
