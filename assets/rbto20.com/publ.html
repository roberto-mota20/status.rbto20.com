<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />
  <meta name="description" content="Publicações, notas e artigos — Roberto Mota" />

  <title>Publicações</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/assets/pfp.jpg" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div class="site-wrapper publ-wrapper">
    <main class="content-frame publ-frame" role="main">

      <!-- Header -->
      <header class="privacy-header publ-header">
        <h1 class="header-name" id="publ-page-title">Publicações</h1>

        <div class="publ-nav-actions">
          <button type="button" class="btn-exit" id="btn-publ-back" aria-label="Voltar para a lista de publicações"
            style="display: none;">
            <span class="btn-exit-icon">←</span>
            <span>Voltar</span>
          </button>
          <a href="/index.html" class="btn-exit" id="btn-home-back" aria-label="Voltar para a página inicial">
            <span class="btn-exit-icon">←</span>
            <span>Início</span>
          </a>
        </div>
      </header>

      <!-- View: Publications List -->
      <section id="view-list" class="publ-view">
        <!-- Posts List Container -->
        <div id="posts-container" class="publ-posts-list">
          <!-- Loading state -->
          <div class="publ-loading" id="posts-loading">
            <span class="publ-spinner"></span>
            <span>Carregando publicações...</span>
          </div>
        </div>
      </section>

      <!-- View: Single Post Reader -->
      <article id="view-post" class="publ-view" style="display: none;">
        <div class="publ-article-header" id="post-header">
          <h1 class="publ-post-title" id="post-title"></h1>
        </div>

        <div class="markdown-body" id="post-content">
          <!-- Markdown rendered content -->
        </div>

        <footer class="publ-article-footer">
          <a href="#" class="privacy-link" id="btn-back-to-top">↑ topo</a>
        </footer>
      </article>

      <!-- Error / Empty State -->
      <div id="view-error" class="publ-view" style="display: none;">
        <div class="privacy-body">
          <p id="error-message">Publicação não encontrada.</p>
          <div class="privacy-links-group">
            <button type="button" class="action-btn" id="btn-error-back">
              ← Ver todas as publicações
            </button>
          </div>
        </div>
      </div>

    </main>

    <!-- Corner Links -->
    <div class="corner-privacy">
      <a href="/privacidade.html" class="privacy-link" id="link-privacy">
        privacidade
      </a>
    </div>
  </div>

  <!-- Markdown Parser and Auto-Indexer Script -->
  <script>
    (function () {
      'use strict';

      // State
      let posts = [];
      let currentPostSlug = null;

      // DOM Elements
      const viewList = document.getElementById('view-list');
      const viewPost = document.getElementById('view-post');
      const viewError = document.getElementById('view-error');
      const postsContainer = document.getElementById('posts-container');
      const btnPublBack = document.getElementById('btn-publ-back');
      const btnHomeBack = document.getElementById('btn-home-back');
      const btnErrorBack = document.getElementById('btn-error-back');
      const btnBackToTop = document.getElementById('btn-back-to-top');

      const postTitle = document.getElementById('post-title');
      const postContent = document.getElementById('post-content');
      const errorMessage = document.getElementById('error-message');

      // Extract Metadata (Title & First Lines of Text as Description)
      function extractMetadata(markdown, filename) {
        // Remove frontmatter if present
        let cleanMd = markdown.replace(/^---[\s\S]*?---\s*/, '');

        // Extract Title from first # Heading
        let title = '';
        const titleMatch = cleanMd.match(/^#\s+(.+)$/m);
        if (titleMatch) {
          title = titleMatch[1].trim();
          // Remove the title line so it doesn't duplicate in description
          cleanMd = cleanMd.replace(/^#\s+.+$/m, '').trim();
        } else {
          // Fallback title from filename
          const baseName = filename.replace(/\.(md|mdx)$/i, '');
          title = baseName
            .split(/[-_]/)
            .map(w => w.charAt(0).toUpperCase() + w.slice(1))
            .join(' ');
        }

        // Extract clean plain text for description
        const plainText = cleanMd
          .replace(/```[\s\S]*?```/g, '') // remove code blocks
          .replace(/!\[.*?\]\(.*?\)/g, '') // remove images
          .replace(/\[([^\]]+)\]\(.*?\)/g, '$1') // keep link text
          .replace(/^#{1,6}\s+.*$/gm, '') // remove headings
          .replace(/^>\s+/gm, '') // remove blockquote markers
          .replace(/^[-*+]\s+/gm, '') // remove list bullets
          .replace(/^\d+\.\s+/gm, '') // remove list numbers
          .replace(/[*_~`|]/g, '') // remove markdown symbols
          .trim();

        // Get first non-empty lines / paragraph
        const paragraphs = plainText.split(/\n\s*\n/).map(p => p.replace(/\s+/g, ' ').trim()).filter(Boolean);
        let description = paragraphs[0] || '';
        if (description.length > 160) {
          description = description.slice(0, 157) + '...';
        }

        const slug = filename.replace(/\.(md|mdx)$/i, '');

        return {
          slug,
          filename,
          title,
          description,
          content: cleanMd
        };
      }

      // Native Markdown / MDX Parser
      function renderMarkdown(md) {
        if (!md) return '';

        let html = md;

        // 1. Code blocks with language
        const codeBlocks = [];
        html = html.replace(/```([a-zA-Z0-9_\-]+)?\n([\s\S]*?)```/g, function (match, lang, code) {
          const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
          const cleanLang = lang ? lang.trim() : 'text';
          const escapedCode = code
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          codeBlocks.push(
            `<div class="code-block-wrapper"><div class="code-block-header"><span class="code-lang">${cleanLang}</span><button type="button" class="btn-copy-code" onclick="copyCode(this)" aria-label="Copiar código">Copiar</button></div><pre><code class="language-${cleanLang}">${escapedCode}</code></pre></div>`
          );
          return placeholder;
        });

        // 2. Inline code
        const inlineCodes = [];
        html = html.replace(/`([^`\n]+)`/g, function (match, code) {
          const placeholder = `__INLINE_CODE_${inlineCodes.length}__`;
          const escaped = code
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          inlineCodes.push(`<code>${escaped}</code>`);
          return placeholder;
        });

        // 3. Horizontal Rules
        html = html.replace(/^(\*{3,}|-{3,}|_{3,})$/gm, '<hr />');

        // 4. Headers
        html = html.replace(/^###### (.*$)/gm, '<h6 id="$1">$1</h6>');
        html = html.replace(/^##### (.*$)/gm, '<h5 id="$1">$1</h5>');
        html = html.replace(/^#### (.*$)/gm, '<h4 id="$1">$1</h4>');
        html = html.replace(/^### (.*$)/gm, '<h3 id="$1">$1</h3>');
        html = html.replace(/^## (.*$)/gm, '<h2 id="$1">$1</h2>');
        html = html.replace(/^# (.*$)/gm, '<h1 id="$1">$1</h1>');

        // 5. Blockquotes
        html = html.replace(/^\> (.*$)/gm, '<blockquote><p>$1</p></blockquote>');
        html = html.replace(/<\/blockquote>\n<blockquote>/g, '');

        // 6. Tables
        html = html.replace(/^(\|.+?\|)\n(\|[-:\s|]+?\|)\n((?:\|.+?\|\n?)+)/gm, function (match, headerRow, alignRow, bodyRows) {
          const headers = headerRow.split('|').slice(1, -1).map(h => `<th>${h.trim()}</th>`).join('');
          const rows = bodyRows.trim().split('\n').map(row => {
            const cells = row.split('|').slice(1, -1).map(c => `<td>${c.trim()}</td>`).join('');
            return `<tr>${cells}</tr>`;
          }).join('');
          return `<div class="table-wrapper"><table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table></div>`;
        });

        // 7. Lists
        html = html.replace(/^- \[(x|X)\] (.*$)/gm, '<li class="task-item"><input type="checkbox" checked disabled /> <span>$2</span></li>');
        html = html.replace(/^- \[ \] (.*$)/gm, '<li class="task-item"><input type="checkbox" disabled /> <span>$2</span></li>');
        html = html.replace(/^[\*\-] (.*$)/gm, '<li>$1</li>');
        html = html.replace(/^\d+\. (.*$)/gm, '<li class="ordered-item">$1</li>');

        html = html.replace(/((?:<li class="task-item">.*?<\/li>\n?)+)/g, '<ul class="task-list">$1</ul>');
        html = html.replace(/((?:<li class="ordered-item">.*?<\/li>\n?)+)/g, '<ol>$1</ol>');
        html = html.replace(/((?:<li>.*?<\/li>\n?)+)/g, '<ul>$1</ul>');

        // 8. Bold, Italic, Strikethrough
        html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/_(.*?)_/g, '<em>$1</em>');
        html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');

        // 9. Images
        html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="md-image" loading="lazy" />');

        // 10. Links
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (match, text, url) {
          const isExternal = url.startsWith('http://') || url.startsWith('https://');
          const attrs = isExternal ? 'target="_blank" rel="noopener noreferrer"' : '';
          return `<a href="${url}" class="text-link" ${attrs}>${text}</a>`;
        });

        // 11. Paragraphs
        const blocks = html.split(/\n\n+/);
        html = blocks.map(block => {
          block = block.trim();
          if (!block) return '';
          if (/^<(h[1-6]|ul|ol|blockquote|div|table|hr|pre)/i.test(block)) {
            return block;
          }
          return `<p>${block.replace(/\n/g, '<br />')}</p>`;
        }).join('\n\n');

        // Restore inline code
        html = html.replace(/__INLINE_CODE_(\d+)__/g, (match, index) => inlineCodes[Number(index)] || match);

        // Restore code blocks
        html = html.replace(/__CODE_BLOCK_(\d+)__/g, (match, index) => codeBlocks[Number(index)] || match);

        return html;
      }

      // Copy Code Utility
      window.copyCode = function (btn) {
        const wrapper = btn.closest('.code-block-wrapper');
        const codeElem = wrapper ? wrapper.querySelector('code') : null;
        if (!codeElem) return;

        navigator.clipboard.writeText(codeElem.innerText).then(() => {
          const origText = btn.textContent;
          btn.textContent = 'Copiado!';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = origText;
            btn.classList.remove('copied');
          }, 2000);
        });
      };

      // Render Posts List
      function renderList(postsToRender) {
        if (!postsToRender || postsToRender.length === 0) {
          postsContainer.innerHTML = `
            <div class="publ-empty">
              <p>Nenhuma publicação encontrada.</p>
            </div>
          `;
          return;
        }

        postsContainer.innerHTML = postsToRender.map(post => {
          return `
            <article class="publ-card" onclick="window.publNavigate('${post.slug}')" role="button" tabindex="0" aria-label="Ler ${post.title}">
              <h2 class="publ-card-title">${post.title}</h2>
              ${post.description ? `<p class="publ-card-desc">${post.description}</p>` : ''}
              <div class="publ-card-footer">
                <span class="publ-read-more">ler publicação →</span>
              </div>
            </article>
          `;
        }).join('');

        // Keyboard accessibility
        postsContainer.querySelectorAll('.publ-card').forEach(card => {
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              card.click();
            }
          });
        });
      }

      // Load Single Post
      async function loadPost(slug) {
        showView('loading');
        currentPostSlug = slug;

        let post = posts.find(p => p.slug === slug || p.filename === slug || p.filename === `${slug}.md` || p.filename === `${slug}.mdx`);
        let rawMarkdown = '';

        if (post && post.rawContent) {
          rawMarkdown = post.rawContent;
        } else {
          // Fetch from publicacoes directory using absolute path
          const candidatePaths = [
            `/publicacoes/${slug}.md`,
            `/publicacoes/${slug}.mdx`,
            `/publicacoes/${slug}`,
            `publicacoes/${slug}.md`,
            `publicacoes/${slug}.mdx`
          ];

          let loaded = false;
          for (const path of candidatePaths) {
            try {
              const res = await fetch(path);
              if (res.ok) {
                rawMarkdown = await res.text();
                loaded = true;
                break;
              }
            } catch (e) {
              // try next
            }
          }

          if (!loaded) {
            showError(`Não foi possível encontrar a publicação "${slug}".`);
            return;
          }

          post = extractMetadata(rawMarkdown, `${slug}.md`);
        }

        document.title = `${post.title} — Publicações`;
        postTitle.textContent = post.title;
        postContent.innerHTML = renderMarkdown(post.content || rawMarkdown);

        btnPublBack.style.display = 'inline-flex';
        btnHomeBack.style.display = 'none';

        showView('post');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // View Switcher
      function showView(viewName) {
        viewList.style.display = viewName === 'list' ? 'flex' : 'none';
        viewPost.style.display = viewName === 'post' ? 'block' : 'none';
        viewError.style.display = viewName === 'error' ? 'block' : 'none';

        if (viewName === 'list') {
          document.title = 'Publicações';
          btnPublBack.style.display = 'none';
          btnHomeBack.style.display = 'inline-flex';
          currentPostSlug = null;
        }
      }

      function showError(msg) {
        errorMessage.textContent = msg || 'Ocorreu um erro ao carregar a página.';
        showView('error');
        btnPublBack.style.display = 'inline-flex';
        btnHomeBack.style.display = 'none';
      }

      // Router / Navigation Handler (URL format: ./publ/slug or /publ/slug)
      window.publNavigate = function (slug) {
        if (slug) {
          const targetUrl = `/publ/${slug}`;
          window.history.pushState({ post: slug }, '', targetUrl);
          loadPost(slug);
        } else {
          window.history.pushState({}, '', '/publ');
          showView('list');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      // Route handling from URL pathname
      function handleRoute() {
        const pathname = window.location.pathname.replace(/\/+$/, '');
        let targetPost = null;

        // Check if path is /publ/slug or publ/slug
        const match = pathname.match(/(?:^|\/)publ\/([^/]+)$/i);
        if (match && match[1] && match[1] !== 'index' && match[1] !== 'index.html' && match[1] !== 'publ.html') {
          targetPost = match[1];
        }

        // Fallbacks for query param and hash
        if (!targetPost) {
          const urlParams = new URLSearchParams(window.location.search);
          targetPost = urlParams.get('post') || urlParams.get('p');
        }
        if (!targetPost && window.location.hash) {
          targetPost = window.location.hash.replace(/^#/, '');
        }

        if (targetPost) {
          loadPost(targetPost);
        } else {
          showView('list');
        }
      }

      // Event Listeners
      window.addEventListener('popstate', (e) => {
        if (e.state && e.state.post) {
          loadPost(e.state.post);
        } else {
          handleRoute();
        }
      });

      btnPublBack.addEventListener('click', () => window.publNavigate(null));
      btnErrorBack.addEventListener('click', () => window.publNavigate(null));

      btnBackToTop.addEventListener('click', (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // Auto-Discovery of Publications without manifest.json
      async function discoverAndLoadPosts() {
        let discoveredFiles = new Set();

        // 1. Try Directory listing fetch (standard web servers / Cloudflare / local)
        try {
          const res = await fetch('/publicacoes/');
          if (res.ok) {
            const html = await res.text();
            const linkRegex = /href=["']([^"']+\.(?:md|mdx))["']/gi;
            let match;
            while ((match = linkRegex.exec(html)) !== null) {
              const filename = match[1].split('/').pop();
              if (filename && !filename.startsWith('.')) {
                discoveredFiles.add(filename);
              }
            }
          }
        } catch (e) {
          // directory listing not allowed or disabled
        }

        // 2. Try GitHub Repository API (for real-time automatic discovery when hosted online)
        try {
          const ghRes = await fetch('https://api.github.com/repos/roberto-mota20/rbto20.com/contents/publicacoes');
          if (ghRes.ok) {
            const files = await ghRes.json();
            if (Array.isArray(files)) {
              files.forEach(f => {
                if (f.name && (f.name.endsWith('.md') || f.name.endsWith('.mdx'))) {
                  discoveredFiles.add(f.name);
                }
              });
            }
          }
        } catch (e) {
          // offline or rate limited
        }

        // 3. Include default test post if nothing found or ensure it exists
        if (discoveredFiles.size === 0) {
          discoveredFiles.add('primeira-publicacao.md');
        }

        // 4. Fetch content of each discovered file and extract metadata automatically
        const loadedPosts = [];
        for (const file of Array.from(discoveredFiles)) {
          try {
            const res = await fetch(`/publicacoes/${file}`);
            if (res.ok) {
              const md = await res.text();
              const meta = extractMetadata(md, file);
              meta.rawContent = md;
              loadedPosts.push(meta);
            }
          } catch (e) {
            console.warn(`Não foi possível carregar ${file}:`, e);
          }
        }

        posts = loadedPosts;
        renderList(posts);

        // Check if a direct post was requested in URL
        handleRoute();
      }

      discoverAndLoadPosts();
    })();
  </script>
</body>

</html>
