<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Privacidade</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/pfp.jpg" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css?v=1.0.2" />
</head>

<body>
  <div class="site-wrapper privacy-wrapper">
    <main class="content-frame privacy-page-frame" role="main">

      <!-- Header & Back Button -->
      <header class="privacy-header">
        <h1 class="header-name">Privacidade</h1>
        <a href="index.html" class="btn-exit" id="btn-back" aria-label="Voltar">
          <span class="btn-exit-icon">←</span>
          <span>Voltar</span>
        </a>
      </header>

      <!-- Minimalist Privacy Content -->
      <article class="privacy-body">
        <p>
          Este site não coleta, rastreia nem armazena dados pessoais ou cookies de navegação.
        </p>

        <p>
          A página é hospedada no <strong>Cloudflare Workers</strong> e a proteção e o monitoramento de tráfego são feitos pela
          <strong>Cloudflare</strong> para mitigação de ataques.
        </p>

        <div class="privacy-links-group">
          <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener noreferrer"
            class="text-link">
            Privacidade da Cloudflare ↗
          </a>
        </div>
      </article>

      <!-- Built with tags -->
      <div class="built-with-tags">
        <a href="https://github.com/" target="_blank" rel="noopener noreferrer" class="tag-link" aria-label="GitHub">
          <img src="assets/tags/github.svg" alt="GitHub" class="tag-badge" />
        </a>
        <a href="https://workers.cloudflare.com" target="_blank" rel="noopener noreferrer" class="tag-link" aria-label="Cloudflare Workers">
          <img src="assets/tags/cloudflare-workers.svg" alt="Cloudflare Workers" class="tag-badge" />
        </a>
      </div>

    </main>

  </div>
</body>

</html>
